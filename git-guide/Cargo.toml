[package]
name = "git-guide"
version = "0.1.0"
edition = "2021"
description = "Fast local Markdown knowledge mapping and agent guidebooks for Git repositories"
license = "MIT"

[[bin]]
name = "git-guide"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4.33"
pulldown-cmark = "0.13.4"
rayon = "1.11"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
